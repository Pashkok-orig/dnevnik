<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Дневник"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0A0A0A"/>
<meta name="format-detection" content="telephone=no"/>
<title>Дневник</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#FFFFFF; --soft:#F5F5F5;
  --ink:#0A0A0A; --ink-2:#4A4A4A; --ink-3:#8C8C8C;
  --line:#E7E7E7; --line-2:#D6D6D6; --on-ink:#FFFFFF;
}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'Golos Text',-apple-system,sans-serif;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none;color:inherit}
input,textarea{-webkit-user-select:text;user-select:text}
svg{display:block}

/* ─── Чёрная шапка ─── */
.app-head{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--on-ink);padding-top:env(safe-area-inset-top)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;max-width:640px;margin:0 auto}
.brand-name{font:600 14px 'Golos Text';letter-spacing:.28em;text-transform:uppercase;color:#fff}
.brand-sub{font:400 12px 'Golos Text';color:#9A9A9A;margin-top:3px}
.savewrap{display:flex;align-items:center;gap:6px}
.save-state{display:flex;align-items:center;gap:6px;font:500 12px 'Golos Text';color:#9A9A9A;margin-right:4px}
.save-state .dot{width:6px;height:6px;border-radius:50%;background:#fff;display:none}
.save-state .tick{width:13px;height:13px;color:#fff}
.save-state[data-state="saving"] .dot{display:block;animation:pulse 1s ease infinite}
.save-state[data-state="saving"] .tick{display:none}
@keyframes pulse{50%{transform:scale(.5);opacity:.4}}
.icon-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#D6D6D6}
.icon-btn:active{background:rgba(255,255,255,.16);color:#fff}
.icon-btn svg{width:19px;height:19px}

.hint{display:flex;gap:10px;align-items:flex-start;background:#181818;border-bottom:1px solid #000;padding:10px 16px;font:400 12.5px/1.55 'Golos Text';color:#A2A2A2}
.hint svg{width:15px;height:15px;flex:0 0 auto;margin-top:2px;color:#8C8C8C}
.hint b{color:#fff;font-weight:600}
.hint button{margin-left:auto;color:#777;font-size:16px;line-height:1;padding:2px 4px;flex:0 0 auto}

/* ─── Разделы ─── */
.tabsrow{display:flex;align-items:stretch;max-width:640px;margin:0 auto;padding:0 8px}
.tabs{flex:1;display:flex;gap:24px;overflow-x:auto;padding:0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;position:relative;padding:13px 2px 12px;font:600 12.5px/1 'Golos Text';letter-spacing:.09em;text-transform:uppercase;color:#8A8A8A;white-space:nowrap}
.tab.active{color:#fff}
.tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#fff}
.tabs-add{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--ink);
  display:flex;align-items:center;justify-content:center;align-self:center;margin-left:10px}
.tabs-add:active{transform:scale(.9)}
.tabs-add svg{width:15px;height:15px}

/* ─── Страница ─── */
.page{max-width:640px;margin:0 auto;padding:0 18px 140px;animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rule{height:1px;background:var(--line);margin:14px 0 2px;position:relative}
.rule::before{content:'';position:absolute;left:0;top:-1px;width:48px;height:3px;background:var(--ink)}

/* ─── Лента дней ─── */
.feed{margin-top:4px;border-top:1px solid var(--line)}
.day{border-bottom:1px solid var(--line);scroll-margin-top:calc(env(safe-area-inset-top,0px) + 120px)}
.day-head{width:100%;display:flex;align-items:center;gap:12px;padding:13px 2px;text-align:left}
.day-head:active{background:var(--soft)}
.day-info{min-width:0}
.day-date{display:block;font:600 17px/1.2 'Spectral',serif;color:var(--ink)}
.day-dow{display:block;font:600 10.5px 'Golos Text';letter-spacing:.15em;text-transform:uppercase;color:var(--ink-2);margin-top:3px}
.chev{width:17px;height:17px;color:#6E6E6E;margin-left:auto;flex:0 0 auto;transition:transform .25s ease}
.day.open .chev{transform:rotate(180deg);color:var(--ink)}
.day-body{padding:0 2px 20px}
.day-tools{display:flex;justify-content:flex-end;gap:2px;margin-bottom:2px}
.mini{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#5A5A5A}
.mini:active{background:var(--soft);color:var(--ink)}
.mini svg{width:15px;height:15px}
.date-wrap{position:relative;display:inline-flex}
.date-wrap input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.ed{font-family:'Spectral',Georgia,serif;font-size:16.5px;line-height:1.75;outline:none;color:var(--ink);-webkit-user-select:text;user-select:text}
.day .ed{min-height:110px;padding-top:10px}
.ed:empty::before{content:attr(data-placeholder);color:#B5B5B5;font-style:italic}
.ed h2{font:600 20px/1.35 'Spectral',serif;margin:12px 0 4px}
.ed p,.ed div{margin:0 0 .25em}
.ed ul{padding-left:1.25em;margin:.2em 0 .4em}
.ed mark{padding:0 2px;border-radius:3px;color:inherit}
.ed b,.ed strong{font-weight:700}

/* ─── Своя вкладка ─── */
.entry-head{position:relative;padding:22px 0 0}
.entry-dow{font:600 10.5px 'Golos Text';letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.entry-title{font:600 27px/1.2 'Spectral',serif;margin-top:7px;padding-right:40px;word-break:break-word}
.entry-menu{position:absolute;top:22px;right:-6px}
.ed-page{min-height:55vh;padding-top:14px;font-size:17px}

/* ─── Термины ─── */
.terms-top{padding:22px 0 0}
.terms-top h1{font:600 27px/1.15 'Spectral',serif}
.term-count{font:500 12.5px 'Golos Text';color:var(--ink-2);margin-top:4px}
.search{display:flex;align-items:center;gap:9px;border:1px solid var(--line-2);border-radius:12px;padding:11px 13px;background:var(--soft);margin-top:14px}
.search svg{width:16px;height:16px;color:var(--ink-3);flex:0 0 auto}
.search input{border:0;outline:0;background:none;flex:1;font:400 16px 'Golos Text';color:var(--ink);min-width:0}
.terms-bar{display:flex;justify-content:space-between;align-items:center;margin:12px 0 2px}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{padding:6px 12px;border-radius:8px;font:500 12.5px 'Golos Text';color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--on-ink)}
.btn-ink{display:inline-flex;align-items:center;gap:7px;background:var(--ink);color:var(--on-ink);
  font:600 14px 'Golos Text';padding:10px 15px;border-radius:12px}
.btn-ink:active{transform:scale(.96)}
.btn-ink svg{width:14px;height:14px}
.letter{font:700 11px 'Golos Text';letter-spacing:.16em;text-transform:uppercase;color:var(--ink);padding:18px 2px 6px;border-bottom:1px solid var(--line)}
.term{padding:13px 2px 15px;border-bottom:1px solid var(--line)}
.term-head{display:flex;align-items:flex-start;gap:8px}
.term-head h3{font:600 17px 'Spectral',serif;flex:1;min-width:0;word-break:break-word}
.term-acts{display:flex;gap:2px;flex:0 0 auto;margin:-4px -8px 0 0}
.term p{font:400 14.5px/1.6 'Golos Text';color:var(--ink-2);margin-top:4px;white-space:pre-wrap}
.empty{text-align:center;padding:52px 24px;color:var(--ink-2)}
.empty svg{width:32px;height:32px;margin:0 auto;opacity:.45}
.empty p{font:400 14px/1.6 'Golos Text';margin:12px 0 18px}

/* ─── Панель инструментов ─── */
.toolbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ink);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));transition:transform .3s ease}
.toolbar.hidden{transform:translateY(130%)}
.trow{display:flex;align-items:center;max-width:640px;margin:0 auto;padding:0 6px;overflow-x:auto;scrollbar-width:none}
.trow::-webkit-scrollbar{display:none}
.tbtn{flex:0 0 auto;width:38px;height:42px;border-radius:11px;color:#CFCFCF;display:flex;align-items:center;justify-content:center}
.tbtn:active,.tbtn.on{background:rgba(255,255,255,.18);color:#fff}
.tbtn svg{width:18px;height:18px}
.tool-sep{flex:0 0 auto;width:1px;height:22px;background:rgba(255,255,255,.24);margin:0 5px}
.hl{flex:0 0 auto;width:30px;height:42px;display:flex;align-items:center;justify-content:center}
.hl i{width:19px;height:19px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.hl.last i{box-shadow:0 0 0 2px var(--ink),0 0 0 3.5px rgba(255,255,255,.9)}

/* ─── Диалоги ─── */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,10,10,.55);display:flex;align-items:flex-end;justify-content:center;
  opacity:0;transition:opacity .25s}
.overlay.center{align-items:center;padding:24px}
.overlay.show{opacity:1}
.dialog{background:var(--bg);width:100%;max-width:520px;border-radius:18px 18px 0 0;
  padding:10px 18px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(40px);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:82dvh;overflow-y:auto}
.overlay.center .dialog{border-radius:18px;padding:22px 20px;max-width:400px;transform:translateY(14px) scale(.97)}
.overlay.show .dialog{transform:none}
.sheet-grip{width:36px;height:4px;border-radius:2px;background:var(--line-2);margin:2px auto 6px}
.sheet-title{font:600 15px 'Golos Text';padding:8px 4px 4px}
.sheet-item{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;border-bottom:1px solid var(--line);
  font:600 15px 'Golos Text';color:var(--ink);text-align:left}
.sheet-item:active{background:var(--soft)}
.sheet-item svg{width:19px;height:19px;color:var(--ink);flex:0 0 auto}
.sheet-item span{display:flex;flex-direction:column;gap:2px;min-width:0}
.sheet-item b{font-weight:400;font-size:12px;color:var(--ink-3)}
.dlg-title{font:600 20px 'Spectral',serif;margin-bottom:16px}
.fld{display:block;margin-bottom:14px}
.fld span{display:block;font:600 11px 'Golos Text';letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.fld input,.fld textarea{width:100%;border:1px solid var(--line-2);background:var(--bg);border-radius:12px;padding:12px 14px;
  font:400 16px 'Golos Text';color:var(--ink);outline:none;resize:none}
.fld input:focus,.fld textarea:focus{border-color:var(--ink)}
.fld .err{border-color:var(--ink)}
.dlg-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.btn-ghost{font:600 14px 'Golos Text';padding:11px 16px;border-radius:12px;border:1px solid var(--line-2);color:var(--ink-2)}
.btn-ghost:active{background:var(--soft)}

/* ─── Тост ─── */
.toast{position:fixed;left:14px;right:14px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:60;max-width:520px;margin:0 auto;
  background:var(--ink);color:var(--on-ink);border-radius:14px;padding:13px 16px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;font:500 13.5px 'Golos Text';
  opacity:0;transform:translateY(16px);transition:.3s;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:none}
.toast button{color:#fff;font:700 13.5px 'Golos Text';padding:4px 2px 4px 12px;flex:0 0 auto;text-decoration:underline;text-underline-offset:3px}
[hidden]{display:none!important}
</style>
</head>
<body>

  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>

  <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-eraser" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21l-4.3-4.3a2 2 0 0 1 0-2.8l9.6-9.6a2 2 0 0 1 2.8 0l5.6 5.6a2 2 0 0 1 0 2.8L13 21H7z"/><path d="M5.5 11l8 8M21 21h-8"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13M10 11v6M14 11v6"/></symbol>

</svg>

<header class="app-head">
  <div class="topbar">
    <div>
      <div class="brand-name">Дневник</div>
      <div class="brand-sub" id="todayLine"></div>
    </div>
    <div class="savewrap">
      <div class="save-state" id="saveState" data-state="saved">
        <i class="dot"></i>
        <svg class="tick"><use href="#i-check"/></svg>
        <span id="saveLabel">Сохранено</span>
      </div>
      <button class="icon-btn" id="btnBackup" aria-label="Резервная копия"><svg><use href="#i-download"/></svg></button>
    </div>
  </div>
  <div class="hint" id="hint" hidden>
    <svg><use href="#i-bookmark"/></svg>
    <span>Добавьте журнал на экран «Домой»: в Safari нажмите <b>«Поделиться»</b> → <b>«На экран “Домой”»</b>. Он откроется как обычное приложение, а записи будут храниться надёжнее.</span>
    <button id="hintClose" aria-label="Скрыть"><svg style="width:13px;height:13px"><use href="#i-x"/></svg></button>
  </div>
  <div class="tabsrow">
    <div class="tabs" id="tabs"></div>
    <button class="tabs-add" id="tabAdd" aria-label="Добавить"><svg><use href="#i-plus"/></svg></button>
  </div>
</header>

<main id="sheet"></main>

<div class="toolbar hidden" id="toolbar">
  <div class="trow">
    <button class="tbtn" data-cmd="bold" aria-label="Жирный"><svg><use href="#i-bold"/></svg></button>
    <button class="tbtn" data-cmd="italic" aria-label="Курсив"><svg><use href="#i-italic"/></svg></button>
    <button class="tbtn" data-cmd="underline" aria-label="Подчёркивание"><svg><use href="#i-underline"/></svg></button>
    <button class="tbtn" data-cmd="h2" aria-label="Заголовок"><svg><use href="#i-heading"/></svg></button>
    <button class="tbtn" data-cmd="insertUnorderedList" aria-label="Список"><svg><use href="#i-list"/></svg></button>
    <span class="tool-sep"></span>
    <button class="hl last" data-hl="#FFE9A0" aria-label="Жёлтый маркер"><i style="background:#FFE9A0"></i></button>

    <button class="hl" data-hl="#FFCFE3" aria-label="Розовый маркер"><i style="background:#FFCFE3"></i></button>
    <button class="hl" data-hl="#BFDCFF" aria-label="Голубой маркер"><i style="background:#BFDCFF"></i></button>
    <span class="tool-sep"></span>
    <button class="tbtn" data-cmd="erase" aria-label="Убрать выделение"><svg><use href="#i-eraser"/></svg></button>
  </div>
</div>

<div class="overlay" id="overlay" hidden><div class="dialog" id="dialog"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
/* ═══════════ Утилиты ═══════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const DOW = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const toISO = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const fromISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const dayName = iso => { const d = fromISO(iso); return d.getDate() + ' ' + MONTHS[d.getMonth()]; };
const plural = (n, f) => { n %= 100; if (n > 19 || n < 10) { const m = n % 10; if (m === 1) return f[0]; if (m >= 2 && m <= 4) return f[1]; } return f[2]; };

/* ═══════════ Данные и сохранение ═══════════ */
const KEY = 'dnevnik.v2', KEY_OLD = 'dnevnik.v1';
let state;

function seed(){
  return {
    days: [{ id: uid(), date: toISO(new Date()), title: null, content: '' }],
    sections: [],
    terms: [{ id: uid(), term: 'Гипотеза', def: 'Научное предположение, выдвигаемое для объяснения какого-либо явления. После подтверждения проверками и экспериментами может стать теорией.', created: Date.now() }],
    active: 'days', openDay: null
  };
}

function migrateV1(){
  try {
    const r = localStorage.getItem(KEY_OLD);
    if (!r) return null;
    const d = JSON.parse(r);
    const st = { days: [], sections: [], terms: d.terms || [], active: 'days', openDay: null };
    for (const t of d.tabs || []) {
      if (t.type === 'day') st.days.push({ id: t.id, date: t.date, title: t.customName ? t.name : null, content: t.content || '' });
      else if (t.type === 'note') st.sections.push({ id: t.id, name: t.name, content: t.content || '' });
    }
    if (!st.days.length) st.days.push({ id: uid(), date: toISO(new Date()), title: null, content: '' });
    if (!st.terms.length) st.terms = seed().terms;
    return st;
  } catch(e){ return null; }
}

function load(){ try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : (migrateV1() || null); } catch(e){ return null; } }

let saveTimer = null;
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} setSave('saved'); }
function saveSoon(){ setSave('saving'); clearTimeout(saveTimer); saveTimer = setTimeout(persist, 500); }
function flush(){ syncEditor(); if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; persist(); } }

function setSave(st){
  const el = $('#saveState');
  if (el.dataset.state === st) return;
  el.dataset.state = st;
  $('#saveLabel').textContent = st === 'saving' ? 'Сохраняю…' : 'Сохранено';
}

/* ═══════════ Разделы (вкладки) ═══════════ */
function renderTabs(){
  const el = $('#tabs');
  let html = `<button class="tab${state.active==='days'?' active':''}" data-id="days">Дни</button>`;
  html += `<button class="tab${state.active==='terms'?' active':''}" data-id="terms">Термины</button>`;
  for (const s of state.sections)
    html += `<button class="tab${state.active===s.id?' active':''}" data-id="${s.id}">${esc(s.name)}</button>`;
  el.innerHTML = html;
  const act = el.querySelector('.tab.active');
  if (act) act.scrollIntoView({ behavior: 'auto', inline: 'center', block: 'nearest' });
}

function switchTab(id){
  if (id === state.active) return;
  syncEditor();
  state.active = id;
  flush();
  render();
  if (state.active === 'days' && state.openDay) focusDay(state.openDay, false);
  else window.scrollTo(0, 0);
}

function render(){ renderTabs(); renderBody(); }

function renderBody(){
  if (state.active === 'days') renderDays();
  else if (state.active === 'terms') renderTerms();
  else renderSection();
}

/* ═══════════ Синхронизация редактора с данными ═══════════ */
let editor = null;

function syncEditor(){
  if (!editor || !editor.isConnected) return;
  const v = editor.innerHTML === '<br>' ? '' : editor.innerHTML;
  if (state.active === 'days') {
    const d = state.days.find(x => x.id === state.openDay);
    if (d) d.content = v;
  } else if (state.active !== 'terms') {
    const s = state.sections.find(x => x.id === state.active);
    if (s) s.content = v;
  }
}

function saveAfterEdit(){ syncEditor(); saveSoon(); }

/* ─── Лента дней (по порядку: старые → новые) ─── */
function sortedDays(){ return [...state.days].sort((a,b) => a.date < b.date ? -1 : 1); }

function dayCard(d){
  const open = state.openDay === d.id;
  const dt = fromISO(d.date);
  const main = d.title ? esc(d.title) : dayName(d.date);
  const sub  = d.title ? dayName(d.date) + ' · ' + DOW[dt.getDay()] : DOW[dt.getDay()];
  return `<section class="day${open ? ' open' : ''}" data-id="${d.id}">
    <button class="day-head" data-act="toggle">
      <span class="day-info"><span class="day-date">${main}</span><span class="day-dow">${sub}</span></span>
      <svg class="chev"><use href="#i-chev"/></svg>
    </button>
    ${open ? `<div class="day-body">
      <div class="day-tools">
        <span class="date-wrap">
          <button class="mini" aria-label="Изменить дату"><svg><use href="#i-calendar"/></svg></button>
          <input type="date" class="day-date-input" value="${d.date}">
        </span>
        <button class="mini" data-act="del" aria-label="Удалить день"><svg><use href="#i-trash"/></svg></button>
      </div>
      <div class="ed" id="editor" contenteditable="true" data-placeholder="Как прошёл день?">${d.content || ''}</div>
    </div>` : ''}
  </section>`;
}

function renderDays(){
  const days = sortedDays();
  $('#sheet').innerHTML = `<div class="page"><div class="feed" id="feed">${
    days.length ? days.map(dayCard).join('')
    : `<div class="empty"><p>Пока нет ни одного дня.</p><button class="btn-ink" id="emptyAdd"><svg><use href="#i-plus"/></svg>Добавить день</button></div>`
  }</div></div>`;

  const feed = $('#feed');
  feed.addEventListener('click', e => {
    const card = e.target.closest('.day');
    if (!card) return;
    const id = card.dataset.id;
    const act = e.target.closest('[data-act]');
    if (act && act.dataset.act === 'del') { deleteDay(id); return; }
    if (act && act.dataset.act === 'toggle') {
      state.openDay = state.openDay === id ? null : id;
      syncEditor();
      persist(); render();
      if (state.openDay === id) focusDay(id, true);
    }
  });
  feed.addEventListener('input', e => {
    if (e.target.id !== 'editor') return;
    const card = e.target.closest('.day');
    const d = state.days.find(x => x.id === card.dataset.id);
    if (d) { d.content = e.target.innerHTML === '<br>' ? '' : e.target.innerHTML; saveSoon(); }
  });
  feed.addEventListener('change', e => {
    if (!e.target.classList.contains('day-date-input')) return;
    const card = e.target.closest('.day');
    const d = state.days.find(x => x.id === card.dataset.id);
    if (d && e.target.value) { d.date = e.target.value; flush(); render(); focusDay(d.id, false); }
  });
  const b = $('#emptyAdd');
  if (b) b.addEventListener('click', () => createDay(nextDayISO()));

  editor = $('#editor');
  setToolbar(!!editor);
}

function focusDay(id, smooth = true){
  requestAnimationFrame(() => {
    const el = document.querySelector(`.day[data-id="${id}"]`);
    if (el) el.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
  });
}

function nextDayISO(){
  const ds = state.days.map(d => d.date).sort();
  const today = toISO(new Date());
  if (!ds.length || ds[ds.length - 1] < today) return today;
  const d = fromISO(ds[ds.length - 1]); d.setDate(d.getDate() + 1);
  return toISO(d);
}

function createDay(iso){
  const day = { id: uid(), date: iso, title: null, content: '' };
  state.days.push(day);
  state.active = 'days'; state.openDay = day.id;
  persist(); render(); focusDay(day.id, true);
  setTimeout(() => {
    const ed = $('#editor');
    if (ed) { try { ed.focus({ preventScroll: true }); } catch(e){ ed.focus(); } caretEnd(ed); }
  }, 380);
}

function deleteDay(id){
  const i = state.days.findIndex(d => d.id === id);
  const [day] = state.days.splice(i, 1);
  if (state.openDay === id) state.openDay = null;
  persist(); render();
  toast('День удалён', 'Вернуть', () => {
    state.days.splice(i, 0, day);
    state.openDay = day.id;
    persist(); render(); focusDay(day.id, false);
  });
}

/* ─── Своя вкладка ─── */
function renderSection(){
  const s = state.sections.find(x => x.id === state.active);
  if (!s) { state.active = 'days'; renderDays(); return; }
  $('#sheet').innerHTML = `<div class="page">
    <div class="entry-head">
      <div class="entry-dow">вкладка</div>
      <h1 class="entry-title">${esc(s.name)}</h1>
      <button class="icon-btn entry-menu" id="btnSecMenu" aria-label="Меню"><svg><use href="#i-dots"/></svg></button>
    </div>
    <div class="rule"></div>
    <div class="ed ed-page" id="editor" contenteditable="true" data-placeholder="Пишите здесь…">${s.content || ''}</div>
  </div>`;
  editor = $('#editor');
  editor.addEventListener('input', saveAfterEdit);
  $('#btnSecMenu').addEventListener('click', () => sectionMenu(s));
  setToolbar(true);
}

    <div class="sheet-grip"></div>

    <button class="sheet-item" id="miRename"><svg><use href="#i-pencil"/></svg><span>Переименовать</span></button>

  `);

    openDialog(`

      </div>`, { center: true });

      const v = $('#fName').value.trim();

      <div class="dlg-actions">

/* ═══════════ Термины ═══════════ */
let termQuery = '', termSort = 'alpha';

function renderTerms(){
  setToolbar(false);
  $('#sheet').innerHTML = `<div class="page">
    <div class="terms-top">
      <h1>Термины</h1>
      <div class="term-count" id="termCount"></div>
    </div>
    <div class="search">
      <svg><use href="#i-search"/></svg>
      <input id="termSearch" placeholder="Найти термин" value="${esc(termQuery)}">
    </div>
    <div class="terms-bar">
      <div class="seg" id="termSortSeg">
        <button data-s="alpha" class="${termSort==='alpha'?'on':''}">А–Я</button>
        <button data-s="new" class="${termSort==='new'?'on':''}">Новые</button>
      </div>
      <button class="btn-ink" id="btnAddTerm"><svg><use href="#i-plus"/></svg>Термин</button>
    </div>
    <div class="rule"></div>
    <div id="termList"></div>
  </div>`;

  $('#termSearch').addEventListener('input', e => { termQuery = e.target.value.trim().toLowerCase(); renderTermList(); });
  $('#termSortSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    termSort = b.dataset.s;
    $('#termSortSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    renderTermList();
  });
  $('#btnAddTerm').addEventListener('click', () => termDialog(null));
  $('#termList').addEventListener('click', e => {
    const art = e.target.closest('.term'); if (!art) return;
    const it = state.terms.find(x => x.id === art.dataset.id);
    if (!it) return;
    const act = e.target.closest('[data-act]');
    if (act && act.dataset.act === 'del') { deleteTerm(it); return; }
    termDialog(it);
  });
  renderTermList();
}

function renderTermList(){
  const list = $('#termList');
  if (!list) return;
  let items = state.terms.slice();
  if (termQuery) items = items.filter(x => (x.term + ' ' + x.def).toLowerCase().includes(termQuery));
  if (termSort === 'alpha') items.sort((a,b) => a.term.localeCompare(b.term, 'ru'));
  else items.sort((a,b) => b.created - a.created);

  $('#termCount').textContent = state.terms.length
    ? state.terms.length + ' ' + plural(state.terms.length, ['термин','термина','терминов']) : '';

  if (!items.length) {
    list.innerHTML = `<div class="empty">
      <svg><use href="#i-book"/></svg>
      <p>${termQuery ? 'Ничего не найдено' : 'Здесь будет ваш словарь. Добавляйте научные термины и их определения — они всегда под рукой.'}</p>
      ${termQuery ? '' : `<button class="btn-ink" id="emptyAdd"><svg><use href="#i-plus"/></svg>Первый термин</button>`}
    </div>`;
    const b = $('#emptyAdd'); if (b) b.addEventListener('click', () => termDialog(null));
    return;
  }
  let html = '', last = '';
  for (const it of items) {
    if (termSort === 'alpha') {
      const L = it.term[0].toUpperCase();
      if (L !== last) { last = L; html += `<div class="letter">${esc(L)}</div>`; }
    }
    html += `<article class="term" data-id="${it.id}">
      <div class="term-head">
        <h3>${esc(it.term)}</h3>
        <span class="term-acts">
          <button class="mini" data-act="edit" aria-label="Редактировать"><svg><use href="#i-pencil"/></svg></button>
          <button class="mini" data-act="del" aria-label="Удалить"><svg><use href="#i-trash"/></svg></button>
        </span>
      </div>
      <p>${esc(it.def)}</p>
    </article>`;
  }
  list.innerHTML = html;
}

function termDialog(existing){
  openDialog(`
    <h3 class="dlg-title">${existing ? 'Редактировать термин' : 'Новый термин'}</h3>
    <label class="fld"><span>Термин</span><input id="fTerm" value="${esc(existing?.term || '')}" placeholder="Например, Гипотеза"></label>
    <label class="fld"><span>Определение</span><textarea id="fDef" rows="4" placeholder="Что это означает…">${esc(existing?.def || '')}</textarea></label>
    <div class="dlg-actions">
      <button class="btn-ghost" data-close>Отмена</button>
      <button class="btn-ink" id="fSave"><svg><use href="#i-check"/></svg>Сохранить</button>
    </div>`, { center: true });
  $('#fSave').addEventListener('click', () => {
    const term = $('#fTerm').value.trim(), def = $('#fDef').value.trim();
    if (!term) { $('#fTerm').classList.add('err'); $('#fTerm').focus(); return; }
    if (existing) { existing.term = term; existing.def = def; }
    else state.terms.push({ id: uid(), term, def, created: Date.now() });
    persist(); closeModal();
    if (state.active === 'terms') renderTermList();
    toast(existing ? 'Изменения сохранены' : 'Термин добавлен');
  });
  setTimeout(() => $('#fTerm').focus(), 120);
}

function deleteTerm(it){
  const i = state.terms.indexOf(it);
  state.terms.splice(i, 1);
  persist(); renderTermList();
  toast(`«${it.term}» удалён`, 'Вернуть', () => {
    state.terms.splice(i, 0, it);
    persist(); renderTermList();
  });
}

/* ═══════════ Панель инструментов: надёжные переключатели ═══════════ */
let lastRange = null;
const INLINE_NAMES = { bold: ['B','STRONG'], italic: ['I','EM'], underline: ['U'] };

function setToolbar(on){ $('#toolbar').classList.toggle('hidden', !on); }

function queryState(cmd){ try { return document.queryCommandState(cmd); } catch(e){ return false; } }

function rangeInEditor(){
  const s = getSelection();
  if (s.rangeCount) {
    const r = s.getRangeAt(0);
    if (editor && editor.contains(r.commonAncestorContainer)) return r;
  }
  return null;
}

function ensureSelection(){
  if (!editor || !editor.isConnected) return null;
  let r = rangeInEditor();
  if (r) return r;
  try { editor.focus({ preventScroll: true }); } catch(e){ editor.focus(); }
  if (lastRange && editor.contains(lastRange.commonAncestorContainer)) {
    try { restoreRange(lastRange); } catch(e){}
    r = rangeInEditor();
    if (r) return r;
  }
  caretEnd(editor);
  return rangeInEditor();
}

function restoreRange(r){ const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

function caretEnd(el){
  const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
  restoreRange(r);
}

function styledAncestor(names){
  if (!editor) return null;
  const s = getSelection();
  if (!s.rangeCount) return null;
  let n = s.anchorNode;
  if (!n || !editor.contains(n)) return null;
  if (n.nodeType === 3) n = n.parentNode;
  while (n && n !== editor) { if (names.includes(n.nodeName)) return n; n = n.parentNode; }
  return null;
}

function unwrap(m){
  const p = m.parentNode;
  while (m.firstChild) p.insertBefore(m.firstChild, m);
  p.removeChild(m);
}

function toggleInline(cmd){
  const names = INLINE_NAMES[cmd];
  const sel = getSelection();
  if (!sel.rangeCount) return;
  const r = sel.getRangeAt(0);
  const isStyled = queryState(cmd) || !!styledAncestor(names);
  if (r.collapsed) {
    // Курсор внутри жирного/курсивного: снимаем стиль с этого куска
    const anc = styledAncestor(names);
    if (isStyled && anc) { unwrap(anc); return; }
    document.execCommand(cmd, false, null); // включаем для будущего текста
    return;
  }
  document.execCommand(cmd, false, null);
  // Страховка: если WebKit не снял стиль — убираем обёртку вручную
  if (isStyled && queryState(cmd)) {
    const anc = styledAncestor(names);
    if (anc && anc.contains(r.commonAncestorContainer)) unwrap(anc);
  }
}

function blockTag(){
  const s = getSelection(); if (!s.anchorNode) return '';
  let n = s.anchorNode;
  if (n.nodeType === 3) n = n.parentNode;
  while (n && n !== editor) { if (/^H[1-3]$|^P$|^DIV$|^LI$/.test(n.nodeName)) return n.nodeName; n = n.parentNode; }
  return '';
}

function tool(cmd){
  if (!editor || !editor.isConnected) return;
  if (!ensureSelection()) return;
  if (cmd === 'erase') clearFormatting();
  else if (cmd === 'bold' || cmd === 'italic' || cmd === 'underline') toggleInline(cmd);
  else if (cmd === 'h2') document.execCommand('formatBlock', false, blockTag() === 'H2' ? 'p' : 'h2');
  else document.execCommand(cmd, false, null);
  saveAfterEdit();
  updateToolStates();
}

function applyHighlight(color){
  if (!editor || !editor.isConnected) return;
  const r = ensureSelection();
  if (!r) { toast('Сначала выделите текст пальцем'); return; }
  const sel = getSelection();
  if (r.collapsed) {
    // Повторное нажатие на тот же цвет убирает выделение под курсором
    let n = sel.anchorNode;
    if (n && n.nodeType === 3) n = n.parentNode;
    while (n && n !== editor && n.nodeName !== 'MARK') n = n.parentNode;
    if (n && n.nodeName === 'MARK') {
      const cur = (n.style.backgroundColor || '').toLowerCase();
      if (cur === color.toLowerCase()) unwrap(n);
      else n.style.backgroundColor = color;
      saveAfterEdit(); updateToolStates();
      return;
    }
    toast('Сначала выделите текст пальцем');
    return;
  }
  const marks = [...editor.querySelectorAll('mark')].filter(m => r.intersectsNode(m));
  const same = marks.filter(m => (m.style.backgroundColor || '').toLowerCase() === color.toLowerCase());
  if (marks.length && same.length === marks.length) {
    // Всё уже выделено этим цветом — снимаем
    marks.forEach(unwrap);
    try { restoreRange(r); } catch(e){}
  } else {
    marks.forEach(unwrap);
    const r2 = rangeInEditor();
    if (!r2 || r2.collapsed) { saveAfterEdit(); return; }
    restoreRange(r2);
    const mark = document.createElement('mark');
    mark.style.backgroundColor = color;
    const frag = r2.extractContents();
    mark.appendChild(frag);
    r2.insertNode(mark);
    const nr = document.createRange(); nr.selectNodeContents(mark);
    restoreRange(nr); lastRange = nr;
  }
  saveAfterEdit();
}

function clearFormatting(){
  if (!editor) return;
  const r = ensureSelection();
  if (!r) return;
  const sel = getSelection();
  if (r.collapsed) {
    let n = sel.anchorNode;
    if (n && n.nodeType === 3) n = n.parentNode;
    while (n && n !== editor) { if (n.nodeName === 'MARK') { unwrap(n); break; } n = n.parentNode; }
  } else {
    editor.querySelectorAll('mark').forEach(m => { if (r.intersectsNode(m)) unwrap(m); });
    try { restoreRange(r); } catch(e){}
  }
  try { document.execCommand('removeFormat', false, null); } catch(e){}
  saveAfterEdit();
}

function updateToolStates(){
  if (!editor || !editor.isConnected) return;
  const s = getSelection();
  if (!s.rangeCount || !editor.contains(s.anchorNode)) return;
  const set = (cmd, v) => {
    const b = document.querySelector(`#toolbar [data-cmd="${cmd}"]`);
    if (b) b.classList.toggle('on', v);
  };
  set('bold', queryState('bold') || !!styledAncestor(INLINE_NAMES.bold));
  set('italic', queryState('italic') || !!styledAncestor(INLINE_NAMES.italic));
  set('underline', queryState('underline') || !!styledAncestor(INLINE_NAMES.underline));
  set('insertUnorderedList', queryState('insertUnorderedList'));
  set('h2', blockTag() === 'H2');
}

document.addEventListener('selectionchange', () => {
  const r = rangeInEditor();
  if (r) lastRange = r;
  updateToolStates();
});

(function bindToolbar(){
  const tb = $('#toolbar');
  const press = e => {
    const btn = e.target.closest('button');
    if (!btn || !$('#sheet').contains(editor)) return;
    e.preventDefault(); e.stopPropagation();
    if (btn.dataset.hl) {
      applyHighlight(btn.dataset.hl);
      tb.querySelectorAll('.hl').forEach(x => x.classList.toggle('last', x === btn));
    } else if (btn.dataset.cmd) tool(btn.dataset.cmd);
  };
  tb.addEventListener('pointerdown', press, { passive: false });
  if (!window.PointerEvent) tb.addEventListener('touchstart', press, { passive: false });
})();

/* ─── Панель всегда поверх клавиатуры (iPhone) ─── */
(function keyboardToolbar(){
  const tb = $('#toolbar');
  if (!window.visualViewport) return;
  const vv = visualViewport;
  let raf = 0;
  const upd = () => {
    const overlap = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    tb.style.bottom = overlap > 0 ? overlap + 'px' : '';
  };
  const onCh = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(upd); };
  vv.addEventListener('resize', onCh);
  vv.addEventListener('scroll', onCh);
  window.addEventListener('resize', onCh);
  window.addEventListener('orientationchange', onCh);
  // iOS сообщает о клавиатуре с задержкой — дублируем проверки после фокуса
  document.addEventListener('focusin', () => { onCh(); setTimeout(onCh, 250); setTimeout(onCh, 700); });
  upd();
})();

/* ═══════════ Диалоги и тосты ═══════════ */
const overlay = $('#overlay'), dialog = $('#dialog');

function openDialog(html, opts = {}){
  overlay.classList.toggle('center', !!opts.center);
  dialog.innerHTML = html;
  overlay.hidden = false;
  requestAnimationFrame(() => overlay.classList.add('show'));
}
function closeModal(){
  overlay.classList.remove('show');
  setTimeout(() => { overlay.hidden = true; dialog.innerHTML = ''; }, 260);
}
overlay.addEventListener('click', e => {
  if (e.target === overlay) closeModal();
  if (e.target.closest('[data-close]')) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !overlay.hidden) closeModal(); });

let toastTimer = null;
function toast(msg, actionLabel, actionFn){
  const el = $('#toast');
  el.innerHTML = `<span>${msg}</span>${actionLabel ? `<button id="toastAct">${actionLabel}</button>` : ''}`;
  el.hidden = false;
  requestAnimationFrame(() => el.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, actionLabel ? 6000 : 2400);
  if (actionLabel) $('#toastAct').addEventListener('click', () => { actionFn(); hideToast(); });
}
function hideToast(){ const el = $('#toast'); el.classList.remove('show'); setTimeout(() => el.hidden = true, 300); }

/* ═══════════ Резервная копия ═══════════ */
function normalizeImport(d){
  if (Array.isArray(d.tabs)) {
    const st = { days: [], sections: [], terms: d.terms || [], active: 'days', openDay: null };
    d.tabs.forEach(t => {
      if (t.type === 'day') st.days.push({ id: t.id, date: t.date, title: t.customName ? t.name : null, content: t.content || '' });
      else if (t.type === 'note') st.sections.push({ id: t.id, name: t.name, content: t.content || '' });
    });
    if (!st.days.length) st.days.push({ id: uid(), date: toISO(new Date()), title: null, content: '' });
    if (!st.terms.length) st.terms = seed().terms;
    return st;
  }
  if (Array.isArray(d.days) && Array.isArray(d.terms)) {
    d.sections = d.sections || []; d.openDay = d.openDay || null;
    return d;
  }
  return null;
}

function backupSheet(){
  openDialog(`
    <div class="sheet-grip"></div>
    <div class="sheet-title">Резервная копия</div>
    <button class="sheet-item" id="bkExport"><svg><use href="#i-download"/></svg><span>Скачать копию<b>Один файл со всеми записями и терминами</b></span></button>
    <button class="sheet-item" id="bkImport"><svg><use href="#i-upload"/></svg><span>Восстановить из файла<b>Заменит текущие записи данными из копии</b></span></button>
    <input type="file" id="bkFile" accept=".json,application/json" hidden>
  `);
  $('#bkExport').addEventListener('click', () => {
    flush();
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'дневник-копия-' + toISO(new Date()) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    closeModal();
    toast('Копия скачана — сохраните её в Файлы');
  });
  $('#bkImport').addEventListener('click', () => $('#bkFile').click());
  $('#bkFile').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      let d = null;
      try { d = normalizeImport(JSON.parse(rd.result)); } catch(err){}
      if (!d) { closeModal(); toast('Не удалось прочитать файл копии'); return; }
      openDialog(`
        <h3 class="dlg-title">Восстановить копию?</h3>
        <p style="font:400 14.5px/1.6 'Golos Text';color:var(--ink-2)">Текущие записи будут заменены данными из файла: дней — ${d.days.length}, терминов — ${d.terms.length}.</p>
        <div class="dlg-actions">
          <button class="btn-ghost" data-close>Отмена</button>
          <button class="btn-ink" id="fRestore"><svg><use href="#i-upload"/></svg>Заменить</button>
        </div>`, { center: true });
      $('#fRestore').addEventListener('click', () => {
        state = d;
        if (state.active !== 'days' && state.active !== 'terms' && !state.sections.some(s => s.id === state.active)) state.active = 'days';
        persist(); closeModal(); render();
        toast('Данные восстановлены');
      });
    };
    rd.readAsText(f);
  });
}

/* ═══════════ Иконка и манифест PWA ═══════════ */
function installPWA(){
  const c = document.createElement('canvas');
  c.width = c.height = 180;
  const x = c.getContext('2d');
  x.fillStyle = '#0A0A0A'; x.fillRect(0, 0, 180, 180);
  x.fillStyle = '#FFFFFF';
  x.font = '700 116px Spectral, Georgia, serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('Д', 90, 84);
  x.fillRect(56, 140, 68, 6);
  const url = c.toDataURL('image/png');
  [['rel','apple-touch-icon'],['rel','icon']].forEach(([k,v]) => {
    const l = document.createElement('link'); l.setAttribute(k, v); l.href = url; document.head.appendChild(l);
  });
  try {
    const mf = { name: 'Дневник', short_name: 'Дневник', start_url: '.', display: 'standalone',
      background_color: '#FFFFFF', theme_color: '#0A0A0A',
      icons: [{ src: url, sizes: '180x180', type: 'image/png' }] };
    const l = document.createElement('link'); l.rel = 'manifest';
    l.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: 'application/json' }));
    document.head.appendChild(l);
  } catch(e){}
}

/* ═══════════ Запуск ═══════════ */
function init(){
  state = load() || seed();
  if (state.active !== 'days' && state.active !== 'terms' && !state.sections.some(s => s.id === state.active)) state.active = 'days';
  if (state.openDay && !state.days.some(d => d.id === state.openDay)) state.openDay = null;

  const now = new Date();
  $('#todayLine').textContent = DOW[now.getDay()] + ', ' + now.getDate() + ' ' + MONTHS[now.getMonth()];

  $('#tabs').addEventListener('click', e => {
    const t = e.target.closest('.tab');
    if (t) switchTab(t.dataset.id);
  });
  $('#tabAdd').addEventListener('click', addSheet);
  $('#btnBackup').addEventListener('click', backupSheet);
  window.addEventListener('pagehide', flush);
  window.addEventListener('beforeunload', flush);

  const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  if (!standalone && !localStorage.getItem('dnevnik.hintHidden')) {
    $('#hint').hidden = false;
    $('#hintClose').addEventListener('click', () => {
      $('#hint').hidden = true;
      localStorage.setItem('dnevnik.hintHidden', '1');
    });
  }

  installPWA();
  render();
  if (state.active === 'days' && state.openDay) focusDay(state.openDay, false);
}
init();
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
